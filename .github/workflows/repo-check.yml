name: Repository Check

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n scripts/bootstrap-aosp.sh
          bash -n scripts/integrate-arina.sh

      - name: Validate SystemUI patcher
        run: |
          python3 -m py_compile scripts/patch-systemui-keyguard.py
          python3 -m py_compile scripts/patch-systemui-keyguard-visuals.py
          python3 -m py_compile scripts/patch-systemui-notifications.py
          grep -q "ARINA_KEYGUARD_AUTH_WIRING" scripts/patch-systemui-keyguard.py
          grep -q "onCredentialAttempt" frameworks/base/packages/SystemUI/src/com/android/systemui/arina/ArinaKeyguardAuthObserver.java
          grep -q "onBiometricAuthenticated" frameworks/base/packages/SystemUI/src/com/android/systemui/arina/ArinaKeyguardAuthObserver.java
          grep -q "ARINA_KEYGUARD_VISUAL_WIRING" scripts/patch-systemui-keyguard-visuals.py
          grep -q "Swipe up to unlock" frameworks/base/packages/SystemUI/src/com/android/systemui/arina/ArinaKeyguardOverlayView.java
          grep -q "notification_stack_scroller" frameworks/base/packages/SystemUI/src/com/android/systemui/arina/ArinaKeyguardVisualController.java
          grep -q "bottom_start:flashlight" vendor/arina/overlay/frameworks/base/packages/SystemUI/res/values/config.xml
          grep -q "bottom_end:camera" vendor/arina/overlay/frameworks/base/packages/SystemUI/res/values/config.xml
          grep -q "ARINA_NOTIFICATION_PRIVACY_WIRING" scripts/patch-systemui-notifications.py
          grep -q "ARINA_NOTIFICATION_GROUP_WIRING" scripts/patch-systemui-notifications.py
          grep -q "onUserExpansionRequested" frameworks/base/packages/SystemUI/src/com/android/systemui/arina/ArinaKeyguardNotificationStyler.java
          grep -q "expandedPublic" frameworks/base/packages/SystemUI/src/com/android/systemui/arina/ArinaKeyguardNotificationStyler.java
          grep -q "RemoteInputView" frameworks/base/packages/SystemUI/src/com/android/systemui/arina/ArinaNotificationInteractionStyler.java
          grep -q "getMenuView" frameworks/base/packages/SystemUI/src/com/android/systemui/arina/ArinaNotificationInteractionStyler.java

      - name: Test notification patcher
        run: python3 -m unittest tests/test_patch_systemui_notifications.py

      - name: Test notification interaction security
        run: python3 -m unittest tests/test_notification_interaction_security.py

      - name: Validate product wiring
        run: |
          grep -q "PRODUCT_PACKAGE_OVERLAYS" vendor/arina/config/common.mk
          grep -q "ArinaHome" vendor/arina/config/common.mk
          ! grep -q "^[[:space:]]*ArinaLockScreen[[:space:]]*$" vendor/arina/config/common.mk

      - name: Show tree
        run: find . -maxdepth 5 -type f | sort

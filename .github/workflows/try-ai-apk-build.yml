name: Build TRY AI Universal API APK

on:
  push:
    branches: [try-ai-apk-build]
    paths-ignore:
      - 'try-ai-output/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Restore TRY AI source
        shell: bash
        run: |
          cat try-ai-build/part*.b64 > try-ai-source.zip.b64
          base64 -d try-ai-source.zip.b64 > try-ai-source.zip
          unzip -q try-ai-source.zip
          test -f tryai_project/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK
        working-directory: tryai_project
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRY-AI-Universal-API-APK
          path: tryai_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Save APK as base64
        shell: bash
        run: |
          mkdir -p try-ai-output
          base64 -w0 tryai_project/app/build/outputs/apk/debug/app-debug.apk > try-ai-output/TRY-AI-Universal-API.apk.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add try-ai-output/TRY-AI-Universal-API.apk.b64
          git commit -m 'build: publish TRY AI APK [skip ci]' || exit 0
          git push origin HEAD:try-ai-apk-build

name: Build ARINA Clean APK
on:
  push:
    branches: ["arina-clean-apk-build"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build
        working-directory: clean_android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify
        run: ls -lh clean_android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ARINA-Clean-Android-APK
          path: clean_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

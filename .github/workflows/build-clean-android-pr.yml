name: Build Clean ARINA Android APK

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build clean ARINA APK
        working-directory: clean_android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: ls -lh clean_android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARINA-Clean-Android-APK
          path: clean_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

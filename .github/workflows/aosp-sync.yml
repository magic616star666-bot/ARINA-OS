name: ARINA AOSP Build

on:
  workflow_dispatch:
    inputs:
      aosp_branch:
        description: AOSP manifest branch
        required: true
        default: android-latest-release

jobs:
  build-reference:
    runs-on: [self-hosted, linux, x64, arina-aosp]
    timeout-minutes: 720

    env:
      AOSP_DIR: ${{ runner.temp }}/aosp
      AOSP_BRANCH: ${{ inputs.aosp_branch }}

    steps:
      - name: Checkout ARINA OS
        uses: actions/checkout@v4

      - name: Capacity check
        run: |
          nproc
          free -h
          df -h

      - name: Sync AOSP
        run: |
          chmod +x scripts/bootstrap-aosp.sh
          scripts/bootstrap-aosp.sh

      - name: Integrate ARINA source layers
        run: |
          chmod +x scripts/integrate-arina.sh
          scripts/integrate-arina.sh

      - name: Build ARINA Home and Lock Screen
        shell: bash
        run: |
          cd "$AOSP_DIR"
          source build/envsetup.sh
          lunch arina_cf_phone-userdebug
          m ArinaHome ArinaLockScreen

      - name: Status
        run: |
          echo "ARINA Home and Lock Screen foundations compiled on the reference AOSP target."
          echo "Shipping Lock Screen integration still requires SystemUI/Keyguard wiring."
          echo "V2318 hardware image remains gated on validated Vivo-specific device sources."

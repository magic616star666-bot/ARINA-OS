name: ARINA AOSP Build

on:
  workflow_dispatch:

jobs:
  build-reference:
    runs-on:
      - self-hosted
      - linux
      - x64
      - arina-aosp
    timeout-minutes: 360

    steps:
      - name: Checkout ARINA OS
        uses: actions/checkout@v4

      - name: Capacity check
        run: |
          nproc
          free -h
          df -h

      - name: Sync AOSP
        env:
          AOSP_DIR: ${{ runner.temp }}/aosp
          AOSP_BRANCH: android-latest-release
        run: |
          chmod +x scripts/bootstrap-aosp.sh
          scripts/bootstrap-aosp.sh

      - name: Integrate ARINA source layers
        env:
          AOSP_DIR: ${{ runner.temp }}/aosp
        run: |
          chmod +x scripts/integrate-arina.sh
          scripts/integrate-arina.sh

      - name: Build ARINA Home and Lock Screen
        env:
          AOSP_DIR: ${{ runner.temp }}/aosp
        shell: bash
        run: |
          cd "$AOSP_DIR"
          source build/envsetup.sh
          lunch arina_cf_phone-userdebug
          m ArinaHome ArinaLockScreen

      - name: Status
        run: |
          echo "ARINA Home and Lock Screen reference build completed."
          echo "Shipping Lock Screen still requires SystemUI/Keyguard wiring."
